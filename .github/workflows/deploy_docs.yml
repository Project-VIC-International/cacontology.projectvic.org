name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC to check for ontology updates
    - cron: '0 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout documentation repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Checkout ontology repository
      uses: actions/checkout@v4
      with:
        repository: Project-VIC-International/CAC-Ontology
        path: ontology-repo
        fetch-depth: 1
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Show Ontospy environment
      run: |
        pip show ontospy || true
        python -c "import sys,ontospy; print('ontospy version:', getattr(ontospy, '__version__', 'unknown')); print('ontospy module:', ontospy.__file__)"
        which ontospy || true
    
    - name: Generate documentation using the checked-out ontology repo
      env:
        ONTOLOGY_REPO_PATH: ontology-repo
      run: |
        python scripts/generate_docs.py
    
    - name: Analyze documentation size
      run: |
        echo "=========================================="
        echo "Documentation Size Analysis"
        echo "=========================================="
        
        if [ ! -d "docs" ]; then
          echo "ERROR: docs/ directory does not exist!"
          exit 1
        fi
        
        # Calculate total size
        total_size_bytes=$(du -sb docs | cut -f1)
        total_size_mb=$(echo "scale=2; $total_size_bytes / 1024 / 1024" | bc)
        total_size_gb=$(echo "scale=2; $total_size_bytes / 1024 / 1024 / 1024" | bc)
        
        echo ""
        echo "Total Documentation Size:"
        echo "  - Bytes: $total_size_bytes"
        echo "  - MB: ${total_size_mb} MB"
        echo "  - GB: ${total_size_gb} GB"
        
        # Check GitHub Pages limits (1GB soft limit)
        if (( $(echo "$total_size_gb > 1.0" | bc -l) )); then
          echo ""
          echo "⚠⚠⚠ CRITICAL WARNING: Total size exceeds GitHub Pages limit! ⚠⚠⚠"
          echo ""
          echo "GitHub Pages has a soft limit of 1GB per repository."
          echo "Current size: ${total_size_gb} GB (${total_size_mb} MB)"
          echo ""
          echo "This will likely cause:"
          echo "  - Deployment failures or timeouts"
          echo "  - Site not loading completely"
          echo "  - Browser timeout issues"
          echo "  - GitHub Pages service disruptions"
          echo ""
          echo "RECOMMENDED ACTIONS:"
          echo "  1. Consider splitting documentation into multiple repositories"
          echo "  2. Use a different hosting solution (e.g., Netlify, Vercel, AWS S3)"
          echo "  3. Reduce documentation scope or optimize further"
          echo "  4. Use lazy loading or pagination for large pages"
          echo ""
          echo "⚠⚠⚠ DEPLOYMENT MAY FAIL OR SITE MAY NOT LOAD ⚠⚠⚠"
          echo ""
          # Don't fail the build, but make it very clear this is a critical issue
        fi
        
        # Count files by type
        total_files=$(find docs -type f | wc -l)
        html_files=$(find docs -type f -name "*.html" | wc -l)
        css_files=$(find docs -type f -name "*.css" | wc -l)
        js_files=$(find docs -type f -name "*.js" | wc -l)
        image_files=$(find docs -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.svg" \) | wc -l)
        
        echo ""
        echo "File Count by Type:"
        echo "  - Total files: $total_files"
        echo "  - HTML files: $html_files"
        echo "  - CSS files: $css_files"
        echo "  - JavaScript files: $js_files"
        echo "  - Image files: $image_files"
        
        # Find largest files (top 10)
        echo ""
        echo "Top 10 Largest Files:"
        echo "----------------------------------------"
        find docs -type f -exec ls -lh {} \; | sort -k5 -hr | head -10 | awk '{printf "  %8s  %s\n", $5, $9}'
        
        # Check for files exceeding 1MB (GitHub Pages recommendation)
        echo ""
        echo "Files Exceeding 1MB (GitHub Pages recommendation):"
        large_files=$(find docs -type f -size +1M -exec ls -lh {} \; | sort -k5 -hr)
        if [ -z "$large_files" ]; then
          echo "  ✓ No files exceed 1MB"
        else
          echo "$large_files" | awk '{printf "  %8s  %s\n", $5, $9}'
        fi
        
        # Check for files exceeding 5MB (browser timeout risk)
        echo ""
        echo "Files Exceeding 5MB (Browser Timeout Risk):"
        very_large_files=$(find docs -type f -size +5M -exec ls -lh {} \; | sort -k5 -hr)
        if [ -z "$very_large_files" ]; then
          echo "  ✓ No files exceed 5MB"
        else
          echo "$very_large_files" | awk '{printf "  %8s  %s\n", $5, $9}'
          echo ""
          echo "⚠ WARNING: Files larger than 5MB may cause browser timeout or memory issues!"
          echo "  Consider optimizing or splitting these files."
        fi
        
        # Analyze largest HTML files specifically
        echo ""
        echo "Largest HTML Files (top 5):"
        find docs -type f -name "*.html" -exec ls -lh {} \; | sort -k5 -hr | head -5 | awk '{printf "  %8s  %s\n", $5, $9}'
        
        # Analyze largest JS and CSS files
        if [ "$js_files" -gt 0 ]; then
          echo ""
          echo "Largest JavaScript Files (top 5):"
          find docs -type f -name "*.js" -exec ls -lh {} \; | sort -k5 -hr | head -5 | awk '{printf "  %8s  %s\n", $5, $9}'
        fi
        
        if [ "$css_files" -gt 0 ]; then
          echo ""
          echo "Largest CSS Files (top 5):"
          find docs -type f -name "*.css" -exec ls -lh {} \; | sort -k5 -hr | head -5 | awk '{printf "  %8s  %s\n", $5, $9}'
        fi
        
        # Estimate load time (rough calculation: assume 1MB/s average connection)
        estimated_load_seconds=$(echo "scale=1; $total_size_mb / 1.0" | bc)
        estimated_load_minutes=$(echo "scale=1; $estimated_load_seconds / 60" | bc)
        
        echo ""
        echo "Estimated Load Time (assuming 1MB/s connection):"
        echo "  - Seconds: ${estimated_load_seconds}s"
        echo "  - Minutes: ${estimated_load_minutes} minutes"
        
        if (( $(echo "$estimated_load_seconds > 30" | bc -l) )); then
          echo ""
          echo "⚠ WARNING: Estimated load time exceeds 30 seconds!"
          echo "  Users may experience timeout issues. Consider optimizing file sizes."
        fi
        
        echo ""
        echo "=========================================="
    
    - name: Upload generated docs artifact (for debugging)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: docs
        path: docs
        if-no-files-found: ignore
    
    - name: Verify generated docs
      run: |
        echo "Verifying generated documentation..."
        
        # Check if docs directory exists
        if [ ! -d "docs" ]; then
          echo "ERROR: docs/ directory does not exist!"
          echo "The documentation generation step may have failed."
          echo "Please check the 'Generate documentation' step output for errors."
          exit 1
        fi
        
        # Check if docs directory is empty
        if [ -z "$(ls -A docs)" ]; then
          echo "ERROR: docs/ directory exists but is empty!"
          echo "The documentation generation step did not produce any files."
          echo "Please check the 'Generate documentation' step output for errors."
          exit 1
        fi
        
        # Count files and show statistics
        total_files=$(find docs -type f | wc -l)
        html_files=$(find docs -type f -name "*.html" | wc -l)
        echo "Documentation directory contains:"
        echo "  - Total files: $total_files"
        echo "  - HTML files: $html_files"
        
        # Verify at least one HTML file exists (required for GitHub Pages)
        if [ "$html_files" -eq 0 ]; then
          echo "ERROR: No HTML files found in docs/ directory!"
          echo "GitHub Pages requires at least one HTML file to serve the site."
          echo "The documentation generation may have failed or produced an unexpected format."
          echo ""
          echo "Files found in docs/:"
          find docs -type f | head -20
          exit 1
        fi
        
        # Show directory size
        dir_size=$(du -sh docs | cut -f1)
        echo "  - Directory size: $dir_size"
        
        # List first few files for debugging
        echo ""
        echo "Sample files in docs/ (first 10):"
        find docs -type f | head -10 | sed 's/^/  - /'
        
        # Check for index.html (preferred but not required)
        if [ -f "docs/index.html" ]; then
          echo ""
          echo "✓ index.html found (good for GitHub Pages)"
        else
          echo ""
          echo "⚠ index.html not found (may need redirect or alternative entry point)"
        fi
        
        echo ""
        echo "✓ Documentation verification passed!"
    
    - name: Validate documentation resources
      run: |
        echo "=========================================="
        echo "Resource Validation"
        echo "=========================================="
        
        if [ ! -d "docs" ]; then
          echo "ERROR: docs/ directory does not exist!"
          exit 1
        fi
        
        # Check if index.html exists and verify redirect target
        if [ -f "docs/index.html" ]; then
          echo ""
          echo "Checking index.html redirect target..."
          # Extract redirect URL from index.html
          redirect_target=$(grep -oP '(?<=url=)[^"]*' docs/index.html | head -1 || grep -oP '(?<=location\.replace\(")[^"]*' docs/index.html | head -1 || echo "")
          if [ -n "$redirect_target" ]; then
            if [ -f "docs/$redirect_target" ]; then
              echo "  ✓ Redirect target '$redirect_target' exists"
            else
              echo "  ⚠ WARNING: Redirect target '$redirect_target' not found!"
            fi
          fi
        fi
        
        # Check for common resource files referenced in HTML
        echo ""
        echo "Checking for referenced resources in HTML files..."
        
        # Find all CSS files referenced
        css_refs=$(find docs -name "*.html" -exec grep -ohP '(?<=href=["'\''])[^"'\'']*\.css' {} \; | sort -u)
        css_missing=0
        if [ -n "$css_refs" ]; then
          echo "  CSS files referenced:"
          for css_ref in $css_refs; do
            # Handle relative paths
            css_file=$(echo "$css_ref" | sed 's|^\./||' | sed 's|^/||')
            if [ -f "docs/$css_file" ]; then
              echo "    ✓ $css_ref"
            else
              echo "    ✗ MISSING: $css_ref"
              css_missing=$((css_missing + 1))
            fi
          done
        fi
        
        # Find all JS files referenced
        js_refs=$(find docs -name "*.html" -exec grep -ohP '(?<=src=["'\''])[^"'\'']*\.js' {} \; | sort -u)
        js_missing=0
        if [ -n "$js_refs" ]; then
          echo ""
          echo "  JavaScript files referenced:"
          for js_ref in $js_refs; do
            # Handle relative paths
            js_file=$(echo "$js_ref" | sed 's|^\./||' | sed 's|^/||')
            if [ -f "docs/$js_file" ]; then
              echo "    ✓ $js_ref"
            else
              echo "    ✗ MISSING: $js_ref"
              js_missing=$((js_missing + 1))
            fi
          done
        fi
        
        # Check for image references
        img_refs=$(find docs -name "*.html" -exec grep -ohP '(?<=src=["'\''])[^"'\'']*\.(png|jpg|jpeg|gif|svg)' {} \; | sort -u | head -20)
        img_missing=0
        if [ -n "$img_refs" ]; then
          echo ""
          echo "  Image files referenced (first 20):"
          for img_ref in $img_refs; do
            # Handle relative paths
            img_file=$(echo "$img_ref" | sed 's|^\./||' | sed 's|^/||')
            if [ -f "docs/$img_file" ]; then
              echo "    ✓ $img_ref"
            else
              echo "    ✗ MISSING: $img_ref"
              img_missing=$((img_missing + 1))
            fi
          done
        fi
        
        # Summary
        echo ""
        echo "Resource Validation Summary:"
        if [ "$css_missing" -eq 0 ] && [ "$js_missing" -eq 0 ] && [ "$img_missing" -eq 0 ]; then
          echo "  ✓ All referenced resources found"
        else
          echo "  ⚠ Missing resources detected:"
          [ "$css_missing" -gt 0 ] && echo "    - CSS files: $css_missing"
          [ "$js_missing" -gt 0 ] && echo "    - JavaScript files: $js_missing"
          [ "$img_missing" -gt 0 ] && echo "    - Image files: $img_missing"
          echo ""
          echo "  NOTE: Some missing resources may be external URLs or dynamically generated."
        fi
        
        echo ""
        echo "=========================================="
    
    - name: Validate namespace IRI resolution
      run: |
        echo "=========================================="
        echo "Namespace IRI Resolution Validation"
        echo "=========================================="
        
        if [ ! -d "docs" ]; then
          echo "ERROR: docs/ directory does not exist!"
          exit 1
        fi
        
        # Count namespace directories (directories with index.html that aren't the root)
        namespace_dirs=$(find docs -mindepth 2 -name "index.html" -exec dirname {} \; | sort -u)
        namespace_count=$(echo "$namespace_dirs" | grep -c . || echo "0")
        
        echo ""
        echo "Namespace Index Pages Found: $namespace_count"
        
        if [ -n "$namespace_dirs" ]; then
          echo ""
          echo "Namespace directories with index pages:"
          echo "$namespace_dirs" | while read dir; do
            rel_path=${dir#docs/}
            entity_count=$(grep -c '<li>' "$dir/index.html" 2>/dev/null || echo "0")
            echo "  ✓ /$rel_path/ ($entity_count entities)"
          done
        else
          echo "  ⚠ WARNING: No namespace index pages found!"
          echo "  This means IRIs like https://cacontology.projectvic.org/abduction#EntityName"
          echo "  will not resolve to documentation pages."
        fi
        
        # Check for common namespace patterns that should have index pages
        echo ""
        echo "Checking for expected namespaces..."
        expected_namespaces=(
          "abduction"
          "ai-generated"
          "asset-forfeiture"
          "athletic"
          "case-management"
          "forensics"
          "grooming"
          "trafficking"
          "sextortion"
        )
        
        missing_namespaces=0
        for ns in "${expected_namespaces[@]}"; do
          if [ -f "docs/$ns/index.html" ]; then
            echo "  ✓ /$ns/ exists"
          else
            # Check if there are any class/prop files for this namespace
            if find docs -name "*-cacontology-$ns*.html" -type f | head -1 | grep -q .; then
              echo "  ⚠ /$ns/ missing but entities exist in documentation"
              missing_namespaces=$((missing_namespaces + 1))
            fi
          fi
        done
        
        # Validate that namespace index pages have proper redirect JavaScript
        echo ""
        echo "Validating namespace index page structure..."
        validation_errors=0
        
        for dir in $namespace_dirs; do
          index_file="$dir/index.html"
          if [ -f "$index_file" ]; then
            # Check for entityMap JavaScript object
            if ! grep -q "entityMap" "$index_file"; then
              echo "  ⚠ $index_file: Missing entityMap redirect logic"
              validation_errors=$((validation_errors + 1))
            fi
            # Check for back link
            if ! grep -q "Back to Main Documentation" "$index_file"; then
              echo "  ⚠ $index_file: Missing back link to main documentation"
            fi
          fi
        done
        
        # Summary
        echo ""
        echo "Namespace IRI Resolution Summary:"
        if [ "$namespace_count" -gt 0 ] && [ "$validation_errors" -eq 0 ] && [ "$missing_namespaces" -eq 0 ]; then
          echo "  ✓ All namespace index pages are properly configured"
          echo "  ✓ IRIs should resolve correctly to documentation"
        else
          if [ "$namespace_count" -eq 0 ]; then
            echo "  ⚠ No namespace index pages found - IRIs may not resolve"
          fi
          if [ "$validation_errors" -gt 0 ]; then
            echo "  ⚠ $validation_errors namespace pages have validation errors"
          fi
          if [ "$missing_namespaces" -gt 0 ]; then
            echo "  ⚠ $missing_namespaces expected namespaces are missing index pages"
          fi
        fi
        
        echo ""
        echo "=========================================="
    
    - name: Prepare docs for GitHub Pages
      run: |
        # Create .nojekyll file to prevent Jekyll processing
        # This ensures all files (including those starting with _) are served
        # Having at least one hidden file also prevents the cp docs/.* error
        touch docs/.nojekyll
        echo "Created .nojekyll file in docs/ directory"
        
        # Verify .nojekyll was created
        if [ -f "docs/.nojekyll" ]; then
          echo "✓ .nojekyll file verified"
        else
          echo "ERROR: Failed to create .nojekyll file"
          exit 1
        fi
        
        # Show final file count before deployment
        echo ""
        echo "Final docs/ directory contents before deployment:"
        echo "  - Total files: $(find docs -type f | wc -l)"
        echo "  - HTML files: $(find docs -type f -name '*.html' | wc -l)"
        echo "  - Hidden files: $(find docs -type f -name '.*' | wc -l)"
        echo "  - Directory size: $(du -sh docs | cut -f1)"
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        cname: cacontology.projectvic.org
        keep_files: false
        force_orphan: false
