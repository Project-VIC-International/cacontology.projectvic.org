name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC to check for ontology updates
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout documentation repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Checkout ontology repository
      uses: actions/checkout@v4
      with:
        repository: Project-VIC-International/CAC-Ontology
        path: ontology-repo
        fetch-depth: 1
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Show Ontospy environment
      run: |
        pip show ontospy || true
        python -c "import sys,ontospy; print('ontospy version:', getattr(ontospy, '__version__', 'unknown')); print('ontospy module:', ontospy.__file__)"
        which ontospy || true
    
    - name: Generate documentation using the checked-out ontology repo
      env:
        ONTOLOGY_REPO_PATH: ontology-repo
      run: |
        python scripts/generate_docs.py
    
    - name: Upload generated docs artifact (for debugging)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docs
        path: docs
        if-no-files-found: ignore
    
    - name: Verify generated docs
      run: |
        test -d docs && ls -lah docs || (echo "docs/ not generated"; exit 1)
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        cname: cacontology.projectvic.org
